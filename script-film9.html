    history.replaceState(null, "", location.pathname); setTimeout(() => toast(a ? `링크에서 메모 ${a}개를 불러왔어요.` : "링크의 검수 상태를 불러왔어요."), 250); } catch (e) {} }
}
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
const allLines = DATA.acts.flatMap((a) => a.lines.map((l) => ({ ...l, act: a.id })));
const lineById = (id) => allLines.find((l) => l.id === id);
const color = (p) => p >= 0.85 ? "var(--ok)" : p >= 0.7 ? "var(--warn)" : "var(--bad)";
function hl(t) { return esc(t).replace(/&quot;(.*?)&quot;/g, '<span class="q">&quot;$1&quot;</span>'); }

function render() {
  const L = DATA.lint, open = state.notes.filter((n) => !n.done).length;
  const okN = DATA.acts.filter((a) => state.verdicts[a.id] === "ok").length, fixN = DATA.acts.filter((a) => state.verdicts[a.id] === "fix").length;
  const dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  let h = `<header><div><h1>${esc(DATA.film)} 대본 검수표</h1>
    <p class="sub">${esc(DATA.draft)} · 작성 ${esc(DATA.writer)} · 검사 ${esc(DATA.checked_by)} · ${esc(DATA.date)}<br>원본: ${esc(DATA.source)}</p></div>
    <div class="summary"><a class="pill" href="./">← WebGL 검수표</a><span class="pill ok">통과 <b>${okN}</b>/3</span><span class="pill warn">수정 <b>${fixN}</b></span><span class="pill">열린 메모 <b>${open}</b></span>
    <button class="themeBtn" id="theme">${dark ? "라이트" : "다크"}</button></div></header>`;
  h += `<section class="grid2"><div class="card"><h3>스토리 점수 (100점 채점표)</h3><div class="big">${DATA.story_total}<small> / 100 · 기준 85</small></div>
    <ul class="rows">${DATA.story_rows.map((r) => `<li><span class="nm">${esc(r.name)}</span><span class="sc">${r.score}/${r.max}</span>
      <div class="bar"><i style="width:${r.score / r.max * 100}%;background:${color(r.score / r.max)}"></i></div><span class="why">${esc(r.why)}</span></li>`).join("")}</ul></div>
    <div class="card"><h3>자동 검사 (lint)</h3><div class="lint">
      <div><b>${L.words}</b><span>단어</span></div><div><b>~${Math.floor(L.spoken_sec / 60)}:${String(L.spoken_sec % 60).padStart(2, "0")}</b><span>실제 낭독 (237 wpm)</span></div>
      <div><b>${L.fk}</b><span>FK 난이도 (2.5–4.0)</span></div><div><b>${L.avg}</b><span>문장당 단어</span></div>
      <div><b>${L.short}</b><span>짧은 문장</span></div><div><b>${L.dialogue}</b><span>대사 줄</span></div>
      <div><b style="color:var(--ok)">${L.fail}</b><span>FAIL</span></div><div><b style="color:var(--ok)">${L.warn}</b><span>WARN</span></div></div>
      <h3>막별 점수</h3><ul class="rows">${DATA.acts.map((a) => `<li><span class="nm">${esc(a.name.split(" · ")[0])}</span><span class="sc">${a.score}</span><div class="bar"><i style="width:${a.score}%;background:${color(a.score / 100)}"></i></div></li>`).join("")}</ul>
      <h3>제목 고르기</h3><div class="titles">${DATA.titles.map((t, i) => `<button class="btn ${state.title === i ? "on" : ""}" data-title="${i}">${i + 1}. ${esc(t)}${i === 0 ? "  (Neon 추천)" : ""}</button>`).join("")}</div></div></section>`;
  DATA.acts.forEach((a) => {
    const v = state.verdicts[a.id];
    h += `<section class="card" id="${a.id}"><div class="actHead"><div><h2>${esc(a.name)}</h2><div class="meta"><span>${esc(a.time)}</span><span><b>${a.words}</b> 단어</span></div></div>
      <div class="actScore">${a.score}<small> / 100</small></div></div>
      <div class="gw"><div class="g"><h4>좋은 점</h4><ul>${a.good.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div><div class="w"><h4>약점</h4><ul>${a.weak.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div></div>
      <div class="chk">3막 검사 · ${esc(a.check)}</div>
      <ol class="lines">${a.lines.map((l) => {
        const ns = state.notes.filter((n) => n.line === l.id && !n.done).length;
        let row = `<li class="ln ${ns ? "has" : ""}"><span class="id">${l.id}</span><span class="tx">${hl(l.text)}${l.owner ? '<span class="own">대표 수정</span>' : ""}</span>
          <span class="lnAct"><button class="btn sm" data-note="${l.id}">${ns ? "메모 " + ns : "메모"}</button></span>`;
        if (openLine === l.id) row += `<div class="composer"><div class="cats">${CATS.map((c) => `<button class="catBtn ${c === curCat ? "on" : ""}" data-cat="${c}">${c}</button>`).join("")}</div>
          <textarea id="ntext" placeholder="${l.id}에 대한 메모 (예: 이 줄 더 자연스럽게)"></textarea><div class="decide"><button class="btn on" id="nsave">저장</button><button class="btn" id="ncancel">닫기</button></div></div>`;
        return row + `</li>`; }).join("")}</ol>
      <div class="decide"><button class="btn v-ok ${v === "ok" ? "on" : ""}" data-v="${a.id}:ok">이 막 통과</button><button class="btn v-fix ${v === "fix" ? "on" : ""}" data-v="${a.id}:fix">수정 필요</button></div></section>`;
  });
  const notes = state.notes.slice().sort((x, y) => x.line.localeCompare(y.line));
  h += `<section class="card"><h3>메모 <span class="decide"><button class="btn sm on" id="copyMd">채팅용 복사 (${open}개)</button><button class="btn sm" id="copyLink">공유 링크</button></span></h3>
    ${notes.length ? `<ul class="notes">${notes.map((n) => `<li class="note ${n.done ? "done" : ""}"><span class="tt">${n.line}</span><div><span class="cat">${esc(n.cat)}</span><div class="txt">${esc(n.text)}</div></div>
      <span class="acts"><button class="btn sm" data-done="${n.id}">${n.done ? "되돌리기" : "완료"}</button><button class="btn sm" data-del="${n.id}">삭제</button></span></li>`).join("")}</ul>` : `<p class="empty">줄 옆의 [메모]를 눌러 남겨 주세요. 브라우저에 자동 저장되고, 끝나면 [채팅용 복사]로 한 번에 보내시면 됩니다.</p>`}</section>`;
  h += `<section class="card"><details><summary>실화 팩트 (원본 그대로 쓴 것)</summary><ul>${DATA.facts.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>
    <details><summary>지어낸 연결 장면</summary><ul>${DATA.bridges.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details></section>`;
  $("#app").innerHTML = h;
  bind();
}
function bind() {
  $("#theme").onclick = () => { const d = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    const n = d ? "light" : "dark"; applyTheme(n); try { localStorage.setItem(THEME_KEY, n); } catch (e) {} render(); };
  document.querySelectorAll("[data-title]").forEach((b) => b.onclick = () => { const i = +b.dataset.title; state.title = state.title === i ? null : i; save(); render(); });
  document.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => { const [a, v] = b.dataset.v.split(":"); state.verdicts[a] = state.verdicts[a] === v ? undefined : v; save(); render(); });
  document.querySelectorAll("[data-note]").forEach((b) => b.onclick = () => { openLine = openLine === b.dataset.note ? null : b.dataset.note; render(); setTimeout(() => $("#ntext")?.focus(), 30); });
  document.querySelectorAll("[data-cat]").forEach((b) => b.onclick = () => { curCat = b.dataset.cat; const t = $("#ntext").value; render(); $("#ntext").value = t; $("#ntext").focus(); });
  const ns = $("#nsave"); if (ns) ns.onclick = () => { const t = $("#ntext").value.trim(); if (!t) { toast("메모 내용을 적어 주세요."); return; }
    state.notes.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), line: openLine, cat: curCat, text: t, done: false }); openLine = null; save(); render(); toast("메모를 저장했어요."); };
  const nc = $("#ncancel"); if (nc) nc.onclick = () => { openLine = null; render(); };
  document.querySelectorAll("[data-done]").forEach((b) => b.onclick = () => { const n = state.notes.find((x) => x.id === b.dataset.done); n.done = !n.done; save(); render(); });
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => { state.notes = state.notes.filter((x) => x.id !== b.dataset.del); save(); render(); });
  $("#copyMd").onclick = () => copy(md(), "채팅용 메모를 복사했어요! 그대로 붙여넣으세요.");
  $("#copyLink").onclick = () => copy(`${location.origin}${location.pathname}#s=${enc(state)}`, "공유 링크를 복사했어요.");
}
function md() {
  const out = [`[${DATA.film} 대본 검수 · ${DATA.draft}]`];
  DATA.acts.forEach((a) => { const v = state.verdicts[a.id]; out.push(`- ${a.name}: ${v === "ok" ? "통과" : v === "fix" ? "수정 필요" : "미정"}`); });
  if (state.title != null) out.push(`- 제목: ${state.title + 1}번 ${DATA.titles[state.title]}`);
  const open = state.notes.filter((n) => !n.done);
  if (open.length) { out.push("", "메모:"); open.sort((x, y) => x.line.localeCompare(y.line)).forEach((n) => { const l = lineById(n.line); out.push(`- ${n.line} [${n.cat}] "${l ? l.text : ""}" → ${n.text}`); }); }
  return out.join("\n");
}
async function copy(s, m) { try { await navigator.clipboard.writeText(s); toast(m); } catch (e) { const t = document.createElement("textarea"); t.value = s; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); toast(m); } }
load(); render();
</script>
</body>
</html>
