<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>후드실화 8화 WebGL 씬 디자인 검수표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #EEF2F1; --panel: #FFFFFF; --ink: #1B2624; --muted: #5E6E6A; --line: #D3DDDA;
  --accent: #2C8C80; --accent-ink: #FFFFFF; --ok: #2F7D45; --warn: #B07A10; --bad: #B9402F;
  --ok-bg: #E2F1E6; --warn-bg: #F7EDD6; --bad-bg: #F6E1DD; --chip: #E3EAE8;
  --display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121817; --panel: #1A2321; --ink: #E6EEEC; --muted: #93A5A0; --line: #2B3835;
  --accent: #4FB3A6; --accent-ink: #0D1514; --ok: #6CC287; --warn: #E0AE4A; --bad: #EE7F6E;
  --ok-bg: #1D3326; --warn-bg: #3A2F17; --bad-bg: #3D211D; --chip: #24302D; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121817; --panel: #1A2321; --ink: #E6EEEC; --muted: #93A5A0; --line: #2B3835;
  --accent: #4FB3A6; --accent-ink: #0D1514; --ok: #6CC287; --warn: #E0AE4A; --bad: #EE7F6E;
  --ok-bg: #1D3326; --warn-bg: #3A2F17; --bad-bg: #3D211D; --chip: #24302D; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 16px }
h1 { font: 32px/1.1 var(--display); margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px }
.summary { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--chip); white-space: nowrap }
.pill b { font-variant-numeric: tabular-nums }
.pill.ok { background: var(--ok-bg); color: var(--ok) }
.pill.warn { background: var(--warn-bg); color: var(--warn) }
.themeBtn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
  padding: 4px 10px; font: 600 12px var(--body); cursor: pointer }
.themeBtn:hover { border-color: var(--accent) }

/* Top cut tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 2px }
.tab { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 7px 11px;
  font: 600 13px var(--body); cursor: pointer; white-space: nowrap; display: flex; gap: 6px; align-items: center }
.tab:hover { border-color: var(--accent) }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.tab .cid { font: 500 12px var(--mono); opacity: .9 }
.tab .n { font: 500 11px var(--mono); padding: 1px 6px; border-radius: 999px; background: var(--warn-bg); color: var(--warn) }
.tab[aria-selected="true"] .n { background: rgba(0,0,0,.22); color: inherit }
.tab .vdot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; flex-shrink: 0 }
.tab .vdot.ok { background: var(--ok); border-color: var(--ok) }
.tab .vdot.fix { background: var(--warn); border-color: var(--warn) }
.tab[aria-selected="true"] .vdot.ok { background: #b9f5cc; border-color: #b9f5cc }
.tab[aria-selected="true"] .vdot.fix { background: #ffe09a; border-color: #ffe09a }

/* Main 2-column grid */
.ep { display: grid; grid-template-columns: minmax(0, 316px) minmax(0, 1fr); gap: 20px; align-items: start }
.rail { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.picker { display: none }
.sizeBtn { display: none }

/* Sticky 9:16 Player + Frame Controls + Live Subtitle */
.player { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 8px }
.screen { aspect-ratio: 9/16; width: 100%; background: #000; border-radius: 14px; overflow: hidden; display: grid; place-items: center; position: relative }
.screen video { width: 100%; height: 100%; display: block; object-fit: contain }
.hudBadge { position: absolute; left: 8px; top: 8px; font: 500 11px var(--mono); color: #fff; background: rgba(0,0,0,.62);
  padding: 2px 7px; border-radius: 6px; pointer-events: none; letter-spacing: .01em }
.now { font: 500 12px var(--mono); color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 6px }
.now b { color: var(--ink) }
.transport { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px }
.tbtn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 2px;
  font: 600 12px var(--mono); cursor: pointer; text-align: center; white-space: nowrap }
.tbtn:hover { border-color: var(--accent) }
.tbtn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.subBox { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px; min-height: 62px; display: grid; gap: 3px }
.subMeta { font: 500 11px var(--mono); color: var(--muted); display: flex; justify-content: space-between; gap: 6px }
.subText { font: 500 13px/1.4 var(--body); color: var(--ink); word-break: keep-all }
.keysHint { font: 500 11px var(--mono); color: var(--muted); text-align: center; line-height: 1.4 }

/* Cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 15px 17px; display: grid; gap: 11px; min-width: 0 }
.title { font: 23px/1.25 var(--display); margin: 0; text-wrap: balance }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 13px; align-items: center }
.meta code { font: 500 12px var(--mono); color: var(--ink); background: var(--chip); padding: 1px 6px; border-radius: 6px; word-break: break-all }
.castRow { display: flex; flex-wrap: wrap; gap: 6px }
.castChip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--ink) }
.castChip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0 }
.decide { display: flex; flex-wrap: wrap; gap: 7px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 9px; padding: 7px 12px; font: 600 13px var(--body); cursor: pointer }
.btn:hover { border-color: var(--accent) }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.v-ok.on { background: var(--ok); border-color: var(--ok); color: var(--panel) }
.btn.v-fix.on { background: var(--warn); border-color: var(--warn); color: var(--panel) }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 8px }
.btn:focus-visible, .tab:focus-visible, .frame:focus-visible, .tbtn:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

h3 { font: 600 13px var(--body); letter-spacing: .04em; color: var(--muted); margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap }

/* Key-frame strip */
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px }
.strip.focusCut { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)) }
.frame { position: relative; border: 2px solid transparent; border-radius: 9px; overflow: hidden; padding: 0; background: var(--chip); cursor: pointer; aspect-ratio: 9/16 }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block }
.frame .t { position: absolute; left: 4px; top: 4px; font: 500 10px var(--mono); color: #fff; background: rgba(0,0,0,.64); padding: 1px 5px; border-radius: 5px }
.frame .dot { position: absolute; right: 5px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px #fff }
.frame.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.frame .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 4px 4px; font: 500 11px/1.2 var(--body); color: #fff; text-align: center;
  word-break: keep-all; background: linear-gradient(transparent, rgba(0,0,0,.82)); text-shadow: 0 1px 2px #000 }

/* Composer & Notes */
.cats { display: flex; flex-wrap: wrap; gap: 6px }
.catBtn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 10px; font: 600 12px var(--body); cursor: pointer }
.catBtn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.composer { display: grid; gap: 9px }
.row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center }
.tin { width: 82px; font: 500 14px var(--mono); padding: 7px 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--ink) }
.tagMono { font: 500 12px var(--mono); padding: 5px 8px; border-radius: 8px; background: var(--chip); color: var(--ink) }
textarea { width: 100%; min-height: 68px; resize: vertical; font: 15px/1.5 var(--body); padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink) }
.syncBar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 4px; border-top: 1px dashed var(--line) }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.note { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line) }
.note.done { opacity: .55 } .note.done .txt { text-decoration: line-through }
.note .tt { font: 500 12px var(--mono); color: var(--accent); background: var(--chip); border: 0; border-radius: 7px; cursor: pointer; padding: 4px 7px; text-align: left; line-height: 1.35 }
.note .tt:hover { filter: brightness(.95) }
.note .cat { display: inline-block; font: 600 11px var(--body); padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); margin-bottom: 3px }
.note .txt { white-space: pre-wrap; word-break: break-word; font-size: 14px }
.note .acts { display: flex; gap: 5px }
.note .acts button { font-size: 12px; padding: 4px 8px }
.empty { color: var(--muted); font-size: 14px; padding: 4px 0 }
.msg { font-size: 13px; color: var(--muted) } .msg.ok { color: var(--ok) } .msg.err { color: var(--bad) }

/* Checks, Staging, Dialogue, Overview Matrix */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
.checks li { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px }
.st { font: 600 12px var(--body); text-align: center; border-radius: 6px; padding: 2px 6px }
.st.ok { background: var(--ok-bg); color: var(--ok) } .st.warn { background: var(--warn-bg); color: var(--warn) } .st.bad { background: var(--bad-bg); color: var(--bad) }
.checks .what { font-weight: 600 } .checks .why { color: var(--muted) }
.bullets { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px }
.dialogList { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px }
.dialogBtn { width: 100%; text-align: left; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 9px;
  padding: 7px 10px; cursor: pointer; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; align-items: baseline; font: 400 13px/1.45 var(--body) }
.dialogBtn:hover { border-color: var(--accent) }
.dialogBtn.active { border-color: var(--accent); background: var(--chip) }
.dialogBtn .dt { font: 500 12px var(--mono); color: var(--accent) }
.cutMatrix { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
.cutRow { width: 100%; text-align: left; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 10px;
  padding: 9px 11px; cursor: pointer; display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; font: 400 13px var(--body) }
.cutRow:hover { border-color: var(--accent) }
.cutRow .idTag { font: 600 12px var(--mono); color: var(--accent) }
.cutRow .subLine { color: var(--muted); font-size: 12px }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--panel);
  padding: 9px 15px; border-radius: 999px; font: 600 13px var(--body); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 40; max-width: 92vw; text-align: center }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0) }

/* Phone layout (<= 760px) */
@media (max-width: 760px) {
  body { --gutter: max(16px, env(safe-area-inset-left, 0px)); padding-top: 10px; padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)) }
  .wrap { gap: 10px }
  header { flex-wrap: wrap; align-items: center; gap: 6px 10px }
  h1 { font-size: 20px; white-space: nowrap }
  .sub { display: none }
  .summary { flex-wrap: wrap; gap: 5px; min-width: 0 }
  .pill { font-size: 11px; padding: 3px 7px }
  .tabs { display: none }
  .picker { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 6px }
  .picker select { min-width: 0; min-height: 44px; font: 600 16px var(--body); padding: 0 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink) }
  .picker .btn { padding: 0; min-height: 44px; font-size: 18px }
  .ep { grid-template-columns: minmax(0, 1fr); gap: 12px }
  .rail { gap: 12px }
  .player { top: 0; z-index: 5; margin-inline: calc(-1 * var(--gutter)); background: var(--bg); padding-bottom: 6px; gap: 5px; border-bottom: 1px solid var(--line) }
  .player.big { position: static }
  .screen { position: relative; aspect-ratio: auto; height: clamp(260px, 88vw, 370px); border-radius: 0 }
  .screen video { position: absolute; inset: 0 }
  .player.big .screen { aspect-ratio: 9/16; height: auto; max-height: 760px }
  .now, .transport, .subBox { margin-inline: var(--gutter) }
  .tbtn { min-height: 36px; font-size: 11px }
  .subBox { min-height: 48px; padding: 7px 10px }
  .keysHint { display: none }
  .sizeBtn { display: inline-block; min-height: 34px; padding: 4px 10px; font-size: 12px }
  body:has(textarea:focus, .tin:focus) .player { position: static }
  .c-head { order: 0 } .c-strip { order: 1 } .c-notes { order: 2 } .c-spec { order: 3 }
  .card { padding: 12px 14px }
  .title { font-size: 19px }
  .meta code { display: none }
  .btn { min-height: 44px; padding: 9px 13px; font-size: 14px }
  .btn.sm { min-height: 36px; padding: 6px 10px; font-size: 12px }
  .catBtn { min-height: 36px; padding: 6px 11px; font-size: 13px }
  .decide .btn { flex: 1 1 auto; white-space: nowrap }
  .strip, .strip.focusCut { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 4px; margin-inline: -4px }
  .frame { flex: 0 0 82px; scroll-snap-align: center; min-height: 146px }
  .tin { min-height: 44px; font-size: 16px; width: 92px }
  textarea { font-size: 16px }
  .note { grid-template-columns: auto minmax(0, 1fr) }
  .note .tt { min-height: 36px }
  .note .acts { grid-column: 1 / -1; justify-content: flex-end }
  .note .acts button { min-height: 36px; font-size: 13px; padding: 6px 12px }
}
@media (max-width: 760px) and (max-height: 500px) { .player { position: static } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>8화 WebGL 씬 디자인 검수표</h1>
      <p class="sub">Surgery Recording (2:48.3 · 11컷) — 컷별 카메라·동선·포즈·소품을 프레임 단위로 검수하고 메모를 모아 채팅에 바로 붙여넣으세요.</p>
    </div>
    <div class="summary" id="summary"></div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="컷 선택"></nav>
  <div class="picker">
    <button class="btn" id="cutPrev" aria-label="이전 컷">‹</button>
    <select id="cutSel" aria-label="컷 고르기"></select>
    <button class="btn" id="cutNext" aria-label="다음 컷">›</button>
  </div>

  <main class="ep">
    <aside class="player" id="player">
      <div class="screen">
        <video id="vid" src="surgery-webgl-v1.mp4" poster="f/surgery-webgl-v1/poster.jpg" controls playsinline preload="metadata"></video>
        <div class="hudBadge" id="hudBadge">C01 · f0000 · clinic</div>
      </div>
      <div class="now">
        <span><b id="nowT">0:00.0</b> · <span id="nowF">f0</span> / 5048</span>
        <button type="button" class="btn sizeBtn" id="sizeBtn" aria-pressed="false">크게 보기</button>
        <span>2:48.3</span>
      </div>
      <div class="transport" role="group" aria-label="프레임 이동 컨트롤">
        <button type="button" class="tbtn" id="btnBack1s" title="1초 뒤로 (Shift+←)">-1s</button>
        <button type="button" class="tbtn" id="btnBack1f" title="1프레임 뒤로 (←)">-1f</button>
        <button type="button" class="tbtn" id="btnPlay" title="재생/일시정지 (Space)">▶</button>
        <button type="button" class="tbtn" id="btnFwd1f" title="1프레임 앞으로 (→)">+1f</button>
        <button type="button" class="tbtn" id="btnFwd1s" title="1초 앞으로 (Shift+→)">+1s</button>
        <button type="button" class="tbtn" id="btnLoop" aria-pressed="false" title="현재 컷 구간 반복 (L)">반복</button>
        <button type="button" class="tbtn" id="btnRate" title="재생 속도 변경">1.0x</button>
      </div>
      <div class="subBox" aria-live="polite">
        <div class="subMeta"><span id="subIdx">대사 동기화</span><span id="subRange">0:00.0</span></div>
        <div class="subText" id="subText">영상을 재생하거나 장면을 누르면 현재 대사가 표시됩니다.</div>
      </div>
      <div class="keysHint">Space 재생 · ←/→ ±1f · Shift+←/→ ±1s · [/] 컷 이동 · L 반복 · N 메모</div>
    </aside>

    <div class="rail" id="rail"></div>
  </main>
</div>

<input type="file" id="importFile" accept="application/json" hidden>

function encodeState(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = ""; bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeState(str) {
  const pad = str.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((str.length + 3) % 4);
  const bin = atob(pad);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        state.verdicts = parsed.verdicts || {};
        state.notes = Array.isArray(parsed.notes) ? parsed.notes : [];
      }
    }
  } catch (e) {}
  const h = location.hash.slice(1);
  if (h.startsWith("s=")) {
    try {
      const incoming = decodeState(h.slice(2));
      if (incoming && typeof incoming === "object") {
        const existingIds = new Set(state.notes.map((n) => n.id));
        let added = 0;
        (incoming.notes || []).forEach((n) => {
          if (n && n.id && !existingIds.has(n.id)) { state.notes.push(n); added++; }
        });
        Object.assign(state.verdicts, incoming.verdicts || {});
        saveState();
        history.replaceState(null, "", location.pathname + location.search);
        setTimeout(() => toast(added ? `링크에서 메모 ${added}개를 불러왔어요.` : "링크의 검수 상태를 동기화했어요."), 250);

    } catch (e) {}
  } else if (TAB_IDS.includes(h)) {
    curTab = h;
  } else {
    try {
      const savedTab = localStorage.getItem(STORAGE_KEY + "-tab");
      if (TAB_IDS.includes(savedTab)) curTab = savedTab;
    } catch (e) {}
  }
}

    .concat(DATA.cuts.map((c) => {
      const v = state.verdicts[c.id] === "ok" ? "✓ " : state.verdicts[c.id] === "fix" ? "! " : "";
      const n = state.notes.filter((x) => x.cut === c.id && !x.done).length;
      return `<option value="${c.id}" ${curTab === c.id ? "selected" : ""}>${v}${c.id.toUpperCase()} ${esc(c.short)} (${fmt(c.t0)})${n ? " · 메모 " + n : ""}</option>`;
    }));
  $("#cutSel").innerHTML = selOpts.join("");
  const idx = TAB_IDS.indexOf(curTab);
  $("#cutPrev").disabled = idx <= 0;
  $("#cutNext").disabled = idx >= TAB_IDS.length - 1;
}

function activeShots() {
  const mapped = DATA.shots.map((s, idx) => ({ idx, cut: s[0], t: s[1], label: s[2] }));
  if (curTab === "all" || showAllShotsInCut) return mapped;
  return mapped.filter((s) => s.cut === curTab);
}

function activeNotes() {
  const list = [...state.notes].sort((a, b) => a.t - b.t);
  if (curTab === "all" || showAllNotesInCut) return list;
  return list.filter((n) => n.cut === curTab);
}

function buildMarkdown() {
  const okCuts = DATA.cuts.filter((c) => state.verdicts[c.id] === "ok").map((c) => c.id.toUpperCase());
  const fixCuts = DATA.cuts.filter((c) => state.verdicts[c.id] === "fix").map((c) => c.id.toUpperCase());
  const open = state.notes.filter((n) => !n.done).sort((a, b) => a.t - b.t);
  const out = [];
  out.push(`## ${DATA.film} WebGL 씬 디자인 검수 메모`);
  out.push(`- 통과 (${okCuts.length}/11): ${okCuts.length ? okCuts.join(", ") : "없음"}`);
  if (fixCuts.length) out.push(`- 수정 필요 (${fixCuts.length}): ${fixCuts.join(", ")}`);
  out.push("");
  if (!open.length) {
    out.push("(열린 수정 메모 없음)");
    return out.join("\n");
  }
  const byCut = new Map();
  open.forEach((n) => {
    const cid = n.cut || cutAtTime(n.t).id;
    if (!byCut.has(cid)) byCut.set(cid, []);
    byCut.get(cid).push(n);
  });
  DATA.cuts.forEach((c) => {
    const items = byCut.get(c.id);
    if (!items || !items.length) return;
    out.push(`### ${c.id.toUpperCase()} · ${c.short} (${c.set}, ${fmt(c.t0)}–${fmt(c.t1)})`);
    items.forEach((n) => {
      out.push(`- [${fmt(n.t)} · f${frameOf(n.t)} · ${n.cat || "기타"}] ${n.text}`);
    });
    out.push("");
  });
  return out.join("\n").trim();
}

function renderNotesListHtml(list) {
  if (!list.length) {
    return `<li class="empty">${curTab === "all" ? "아직 메모가 없어요. 위 장면을 누르거나 영상을 멈추고 씬 디자인 수정 메모를 남겨 주세요." : "이 컷에 남긴 메모가 아직 없어요."}</li>`;
  }
  return list.map((n) => {
    const cid = (n.cut || cutAtTime(n.t).id).toUpperCase();
    return `<li class="note ${n.done ? "done" : ""}">` +
      `<button type="button" class="tt" data-seek="${n.t}">${fmt(n.t)}<br>f${frameOf(n.t)} · ${cid}</button>` +
      `<div><span class="cat">${esc(n.cat || "기타")}</span><div class="txt">${esc(n.text)}</div></div>` +
      `<div class="acts">` +
      `<button type="button" class="btn" data-done="${n.id}">${n.done ? "다시 열기" : "반영됨"}</button>` +
      `<button type="button" class="btn" data-del="${n.id}">삭제</button>` +
      `</div></li>`;
  }).join("");
}

function renderRail() {
  const cut = DATA.cuts.find((c) => c.id === curTab) || null;
  const shots = activeShots();
  const notes = activeNotes();
  const openAll = state.notes.filter((n) => !n.done);
  const notedSlots = new Set(openAll.map((n) => slotAt(DATA.shots, n.t)));
  const vid = $("#vid");
  const nowT = vid ? vid.currentTime : (cut ? cut.t0 : 0);
  const nowCut = cutAtTime(nowT);

  let headHtml = "";
  if (!cut) {
    const castChips = Object.values(DATA.cast).map((m) =>
      `<span class="castChip"><i style="background:${m.color}"></i>${esc(m.name)}</span>`
    ).join("");
    headHtml = `
      <div class="card c-head">
        <h2 class="title">8화 Surgery Recording · WebGL 씬 디자인 검수</h2>

          <span>${DATA.len.toFixed(1)}초 · ${DATA.totalFrames.toLocaleString()}f @ 30fps · 11컷 · 4세트</span>

        <div class="castRow">${castChips}</div>
        <div class="decide">

          <button type="button" class="btn" id="startReviewBtn">C01부터 순서대로 보기</button>
        </div>
      </div>`;
  } else {
    const v = state.verdicts[cut.id] || "";
    const castChips = cut.cast.map((k) => {
      const m = DATA.cast[k];
      return `<span class="castChip"><i style="background:${m.color}"></i>${esc(m.name)}</span>`;
    }).join("");
    headHtml = `
      <div class="card c-head">
        <h2 class="title">${esc(cut.title)}</h2>
        <div class="meta">
          <span>${fmt(cut.t0)}–${fmt(cut.t1)} (${(cut.t1 - cut.t0).toFixed(1)}초 · f${cut.f0}–${cut.f1 - 1})</span>
          <span>전환: <b>${esc(cut.trans)}</b></span>
          <code>${esc(cut.src)}</code>
        </div>
        <div class="castRow">${castChips}</div>
        <div class="decide">
          <button type="button" class="btn v-ok ${v === "ok" ? "on" : ""}" data-verdict="ok" aria-pressed="${v === "ok"}">이 컷 통과</button>
          <button type="button" class="btn v-fix ${v === "fix" ? "on" : ""}" data-verdict="fix" aria-pressed="${v === "fix"}">이 컷 수정 필요</button>
          <button type="button" class="btn" id="jumpCutStart">컷 시작으로</button>
          <button type="button" class="btn ${loopCut ? "on" : ""}" id="loopCutBtn">${loopCut ? "컷 반복 중" : "이 컷 반복"}</button>
        </div>
      </div>`;
  }

  const stripHtml = `
    <div class="card c-strip">
      <h3>
        <span>${cut && !showAllShotsInCut ? `${cut.id.toUpperCase()} 주요 장면 ${shots.length}곳` : `전체 주요 장면 ${shots.length}곳`} · 탭하면 이동</span>
        ${cut ? `<button type="button" class="btn sm" id="toggleShotsBtn">${showAllShotsInCut ? "이 컷만 보기" : "전체 45장 보기"}</button>` : ""}
      </h3>
      <div class="strip ${cut && !showAllShotsInCut ? "focusCut" : ""}" id="strip">
        ${shots.map((s) => {
          const num = String(s.idx + 1).padStart(3, "0");
          const hasDot = notedSlots.has(s.idx);
          return `<button type="button" class="frame" data-t="${s.t}" data-i="${s.idx}" aria-label="${s.cut.toUpperCase()} ${fmt(s.t)} ${esc(s.label)}">` +
            `<img loading="lazy" src="f/${DATA.id}/${num}.jpg" alt="">` +
            `<span class="t">${cut && !showAllShotsInCut ? fmt(s.t) : `${s.cut.toUpperCase()} ${fmt(s.t)}`}</span>` +
            `<span class="cap">${esc(s.label)}</span>` +
            `${hasDot ? '<span class="dot" title="수정 메모 있음"></span>' : ""}</button>`;
        }).join("")}
      </div>
    </div>`;

  const notesHtml = `
    <div class="card c-notes">
      <h3>
        <span>씬 디자인 수정 메모 (${notes.length}개)</span>

      </h3>
      <form class="composer" id="noteForm">
        <div class="cats" role="radiogroup" aria-label="수정 카테고리">
          ${CATS.map((c) => `<button type="button" class="catBtn ${curCat === c ? "on" : ""}" data-cat="${c}" aria-pressed="${curCat === c}">${c}</button>`).join("")}
        </div>
        <div class="row">
          <label for="tin" class="msg">시간</label>
          <input class="tin" id="tin" value="${fmt(nowT)}" inputmode="decimal" aria-label="타임스탬프">
          <span class="tagMono" id="frameTag">f${frameOf(nowT)} · ${nowCut.id.toUpperCase()}</span>
          <button type="button" class="btn sm" id="useNow">지금 시간</button>
        </div>
        <textarea id="txt" placeholder="예: ${cut ? cut.id.toUpperCase() : "C02"} 카메라를 살짝 뒤로 빼서 손과 표정이 함께 보이게" aria-label="메모 내용"></textarea>
        <div class="row">
          <button type="submit" class="btn on">메모 남기기</button>
          <span class="msg" id="fmsg">브라우저에 자동 저장됩니다. 끝나면 아래 [채팅용 복사]로 한 번에 보내세요.</span>
        </div>
      </form>
      <div class="syncBar">
        <button type="button" class="btn sm on" id="copyMdBtn">채팅용 복사 (${openAll.length}개)</button>
        <button type="button" class="btn sm" id="copyLinkBtn">메모 포함 링크 복사</button>
        <button type="button" class="btn sm" id="exportJsonBtn">JSON 백업</button>
        <button type="button" class="btn sm" id="importJsonBtn">불러오기</button>
      </div>
      <ul class="notes" id="noteList">${renderNotesListHtml(notes)}</ul>
    </div>`;

  let specHtml = "";
  if (!cut) {
    const rows = DATA.cuts.map((c) => {
      const v = state.verdicts[c.id];
      const badge = v === "ok" ? '<span class="st ok">통과</span>' : v === "fix" ? '<span class="st warn">수정</span>' : '<span class="st ok">8/8</span>';
      const n = state.notes.filter((x) => x.cut === c.id && !x.done).length;
      return `<li><button type="button" class="cutRow" data-open-cut="${c.id}">` +
        `<span class="idTag">${c.id.toUpperCase()}</span>` +
        `<div><b>${esc(c.short)}</b> <span class="subLine">· ${c.set} · ${fmt(c.t0)}–${fmt(c.t1)} · ${c.trans}</span>` +
        `<div class="subLine">${esc(c.watch[0])}</div></div>` +
        `<span style="display:flex;gap:6px;align-items:center">${n ? `<span class="pill warn">메모 ${n}</span>` : ""}${badge}</span>` +
        `</button></li>`;
    }).join("");
    specHtml = `
      <div class="card c-spec">
        <h3>11컷 전체 씬 구성 · 8/8 자동 규칙 전원 통과 (클릭하면 해당 컷으로 이동)</h3>
        <ul class="cutMatrix">${rows}</ul>
        <h3>직접 눈으로 보면 좋은 씬 디자인 포인트</h3>
        <ul class="bullets">
          <li><b>카메라 프레이밍:</b> C02 간호사 입장(0:23.5), C03 카운트다운 상단 여백(0:35.0), C07 입장(1:53.5), C10 엔딩 폰 위치(2:46.8)</li>
          <li><b>속도·리듬:</b> C09 법정 카메라 회전(2.46°/f, 한계 2.5° 근접)이 과하게 빠른지, C05 차 안 리액션 구간에 OR 컷어웨이가 더 필요한지</li>
          <li><b>연속성:</b> C07→C08 2:16.6 (f4098) joinPose 0프레임 전환 이음새가 완전히 자연스러운지</li>
          <li><b>세트 & 소품:</b> 4개 세트(clinic·car·office·court) 실측 배치, 글씨(REC 47:12, HEMORRHOIDS, $500,000, FIRED) 가독성</li>
        </ul>
      </div>`;
  } else {
    const cutLines = DATA.lines
      .map((l, i) => ({ i: i + 1, a: l[0], b: l[1], txt: l[2] }))
      .filter((l) => l.b >= cut.t0 + 0.05 && l.a <= cut.t1 - 0.05);
    specHtml = `
      <div class="card c-spec">
        <h3>세트 · 카메라 & 블로킹 구성</h3>
        <div class="meta"><span><b>세트 (${cut.set}):</b> ${esc(DATA.sets[cut.set])}</span></div>
        <ul class="bullets">${cut.staging.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>
        <h3>중점 체크 포인트 (사람 눈 검수)</h3>
        <ul class="bullets">${cut.watch.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>
        <h3>이 컷의 내레이션 대사 (${cutLines.length}문장 · 클릭 시 해당 대사로 이동)</h3>
        <ul class="dialogList" id="dialogList">
          ${cutLines.map((l) => `<li><button type="button" class="dialogBtn" data-seek="${l.a}" data-lidx="${l.i}"><span class="dt">${fmt(l.a)}</span><span>${esc(l.txt)}</span></button></li>`).join("")}
        </ul>
        <h3>자동 8개 규칙 수치 점검 (check_${cut.id} + check_take)</h3>
        <ul class="checks">
          ${cut.checks.map(([st, w, y]) => `<li><span class="st ${st}">${st === "ok" ? "완료" : st === "warn" ? "확인" : "미완"}</span><span><span class="what">${esc(w)}</span> · <span class="why">${esc(y)}</span></span></li>`).join("")}
        </ul>
      </div>`;
  }

  $("#rail").innerHTML = headHtml + stripHtml + notesHtml + specHtml;
  bindRailEvents(cut);
  syncTimeUI(nowT);
}

function updateNoteFormTag() {
  const tin = $("#tin");
  const tag = $("#frameTag");
  if (!tin || !tag) return;
  const t = parseT(tin.value);
  tag.textContent = `f${frameOf(t)} · ${cutAtTime(t).id.toUpperCase()}`;
}

function bindRailEvents(cut) {
  document.querySelectorAll("[data-verdict]").forEach((b) => {
    b.addEventListener("click", () => {
      if (!cut) return;
      const v = b.dataset.verdict;
      state.verdicts[cut.id] = state.verdicts[cut.id] === v ? "" : v;
      saveState();
      renderSummary();
      renderTabs();
      renderRail();
    });
  });
  $("#jumpCutStart")?.addEventListener("click", () => { if (cut) { seek(cut.t0); $("#vid")?.play().catch(() => {}); } });
  $("#loopCutBtn")?.addEventListener("click", () => toggleLoop());
  $("#startReviewBtn")?.addEventListener("click", () => openTab("c01", true));
  $("#copyMdTop")?.addEventListener("click", copyMarkdown);
  $("#copyLinkTop")?.addEventListener("click", copyShareLink);

  document.querySelectorAll(".frame").forEach((b) => {
    b.addEventListener("click", () => {
      seek(+b.dataset.t);
      if (!TOUCH) $("#txt")?.focus({ preventScroll: true });
    });
  });
  $("#toggleShotsBtn")?.addEventListener("click", () => { showAllShotsInCut = !showAllShotsInCut; renderRail(); });
  $("#toggleNotesBtn")?.addEventListener("click", () => { showAllNotesInCut = !showAllNotesInCut; renderRail(); });

  document.querySelectorAll(".catBtn").forEach((b) => {
    b.addEventListener("click", () => {
      curCat = b.dataset.cat;
      document.querySelectorAll(".catBtn").forEach((x) => {
        const on = x.dataset.cat === curCat;
        x.classList.toggle("on", on);
        x.setAttribute("aria-pressed", on);
      });
    });
  });

  $("#tin")?.addEventListener("input", updateNoteFormTag);
  $("#useNow")?.addEventListener("click", () => {
    const v = $("#vid");
    if (v && $("#tin")) { $("#tin").value = fmt(v.currentTime); updateNoteFormTag(); }
  });
  $("#noteForm")?.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const ta = $("#txt");
    const text = ta.value.trim();
    if (!text) return;
    const t = Math.round(parseT($("#tin").value) * 10) / 10;
    const c = cutAtTime(t);
    state.notes.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      cut: c.id,
      t,
      cat: curCat,
      text,
      done: false,
      at: new Date().toISOString(),
    });
    saveState();
    ta.value = "";
    renderSummary();
    renderTabs();
    refreshNotesAndDots();
    toast(`${c.id.toUpperCase()} ${fmt(t)} 메모 저장됨`);
  });

  $("#copyMdBtn")?.addEventListener("click", copyMarkdown);
  $("#copyLinkBtn")?.addEventListener("click", copyShareLink);
  $("#exportJsonBtn")?.addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ film: DATA.id, ...state }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `film8-webgl-notes-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast("JSON 파일로 저장했어요.");
  });
  $("#importJsonBtn")?.addEventListener("click", () => $("#importFile").click());

  document.querySelectorAll(".dialogBtn").forEach((b) => {
    b.addEventListener("click", () => seek(+b.dataset.seek));
  });
  document.querySelectorAll("[data-open-cut]").forEach((b) => {
    b.addEventListener("click", () => openTab(b.dataset.openCut, true));
  });

  bindNoteItemEvents();
}

function bindNoteItemEvents() {
  document.querySelectorAll(".note .tt").forEach((b) => {
    b.addEventListener("click", () => {
      seek(+b.dataset.seek);
      if (!TOUCH) $("#txt")?.focus({ preventScroll: true });
    });
  });
  document.querySelectorAll("[data-done]").forEach((b) => {
    b.addEventListener("click", () => {
      const n = state.notes.find((x) => x.id === b.dataset.done);
      if (!n) return;
      n.done = !n.done;
      saveState();
      renderSummary();
      renderTabs();
      refreshNotesAndDots();
    });
  });
  document.querySelectorAll("[data-del]").forEach((b) => {
    b.addEventListener("click", () => {
      if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "정말 삭제"; return; }
      state.notes = state.notes.filter((x) => x.id !== b.dataset.del);
      saveState();
      renderSummary();
      renderTabs();
      refreshNotesAndDots();
      toast("메모를 삭제했어요.");
    });
  });
}

function refreshNotesAndDots() {
  const ul = $("#noteList");
  const notes = activeNotes();
  if (ul) {
    ul.innerHTML = renderNotesListHtml(notes);
    bindNoteItemEvents();
  }
  const openAll = state.notes.filter((n) => !n.done);
  const notedSlots = new Set(openAll.map((n) => slotAt(DATA.shots, n.t)));
  document.querySelectorAll(".frame").forEach((f) => {
    const has = notedSlots.has(+f.dataset.i);
    const dot = f.querySelector(".dot");
    if (has && !dot) f.insertAdjacentHTML("beforeend", '<span class="dot" title="수정 메모 있음"></span>');
    else if (!has && dot) dot.remove();
  });
  const cm = $("#copyMdBtn"); if (cm) cm.textContent = `채팅용 복사 (${openAll.length}개)`;
  const cmt = $("#copyMdTop"); if (cmt) cmt.textContent = `채팅용 메모 복사 (${openAll.length}개)`;
  const head = document.querySelector(".c-notes h3 span");
  if (head) head.textContent = `씬 디자인 수정 메모 (${notes.length}개)`;
}

async function copyText(str, okMsg) {
  try {
    await navigator.clipboard.writeText(str);
    toast(okMsg);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = str; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(okMsg); } catch (err) { toast("복사에 실패했어요. 직접 선택해 복사해 주세요."); }
    ta.remove();
  }
}

function copyMarkdown() {
  copyText(buildMarkdown(), "채팅용 메모를 복사했어요! 그대로 붙여넣으세요.");
}

function copyShareLink() {
  const payload = encodeState(state);
  const url = `${location.origin}${location.pathname}${location.search}#s=${payload}`;
  copyText(url, "메모 포함 링크를 복사했어요! PC/폰에서 열면 동기화됩니다.");
}

function syncTimeUI(t) {
  const f = frameOf(t);
  const c = cutAtTime(t);
  $("#nowT").textContent = fmt(t);
  $("#nowF").textContent = "f" + f;
  $("#hudBadge").textContent = `${c.id.toUpperCase()} · f${String(f).padStart(4, "0")} · ${c.set}`;

  const ln = lineAtTime(t);
  if (ln) {
    $("#subIdx").textContent = `대사 #${ln.i}/54`;
    $("#subRange").textContent = `${fmt(ln.a)}–${fmt(ln.b)}`;
    $("#subText").textContent = ln.txt;
  } else {
    $("#subIdx").textContent = `${c.id.toUpperCase()} · ${c.short}`;
    $("#subRange").textContent = fmt(t);
    $("#subText").textContent = "(대사 사이 쉼 / SFX 구간)";
  }
  document.querySelectorAll(".dialogBtn").forEach((b) => {
    b.classList.toggle("active", !!(ln && +b.dataset.lidx === ln.i));
  });

  const idx = slotAt(DATA.shots, t);
  document.querySelectorAll(".frame").forEach((el) => {
    const on = +el.dataset.i === idx;
    const was = el.classList.contains("cur");
    el.classList.toggle("cur", on);
    const parent = el.parentElement;
    if (on && !was && parent && parent.scrollWidth > parent.clientWidth) {
      parent.scrollLeft = el.offsetLeft - parent.offsetLeft - (parent.clientWidth - el.offsetWidth) / 2;
    }
  });
}

function seek(t, updateInput = true) {
  t = Math.max(0, Math.min(DATA.len - 0.01, +t || 0));
  const v = $("#vid");
  if (v) {
    if (v.readyState < 1) {
      v.addEventListener("loadedmetadata", () => { v.currentTime = t; }, { once: true });
      v.load();
    } else {
      try { v.currentTime = t; } catch (e) {}
    }
  }
  if (updateInput && $("#tin") && document.activeElement !== $("#tin")) {
    $("#tin").value = fmt(t);
    updateNoteFormTag();
  }
  syncTimeUI(t);
}

function step(deltaSec) {
  const v = $("#vid");
  if (!v) return;
  v.pause();
  seek(v.currentTime + deltaSec);
}

function toggleLoop() {
  loopCut = !loopCut;
  const b1 = $("#btnLoop");
  if (b1) { b1.classList.toggle("on", loopCut); b1.setAttribute("aria-pressed", loopCut); }
  const b2 = $("#loopCutBtn");
  if (b2) { b2.classList.toggle("on", loopCut); b2.textContent = loopCut ? "컷 반복 중" : "이 컷 반복"; }
  const c = DATA.cuts.find((x) => x.id === curTab) || cutAtTime($("#vid")?.currentTime || 0);
  toast(loopCut ? `${c.id.toUpperCase()} 구간 반복 켜짐` : "구간 반복 꺼짐");
}

function openTab(id, autoSeek = true) {
  if (!TAB_IDS.includes(id)) return;
  curTab = id;
  showAllShotsInCut = false;
  showAllNotesInCut = false;
  try { localStorage.setItem(STORAGE_KEY + "-tab", curTab); } catch (e) {}
  renderTabs();
  renderRail();
  const c = DATA.cuts.find((x) => x.id === curTab);
  if (autoSeek && c) seek(c.t0);
}

function init() {
  loadState();
  renderSummary();
  renderTabs();
  renderRail();

  const v = $("#vid");
  v.addEventListener("timeupdate", () => {
    if (loopCut) {
      const c = DATA.cuts.find((x) => x.id === curTab) || cutAtTime(v.currentTime);
      if (v.currentTime >= c.t1 - 0.04) { v.currentTime = c.t0; }
    }
    syncTimeUI(v.currentTime);
  });
  v.addEventListener("play", () => { $("#btnPlay").textContent = "❚❚"; });
  v.addEventListener("pause", () => {
    $("#btnPlay").textContent = "▶";
    if ($("#tin") && document.activeElement !== $("#tin")) {
      $("#tin").value = fmt(v.currentTime);
      updateNoteFormTag();
    }
  });

  $("#btnBack1s").addEventListener("click", () => step(-1));
  $("#btnBack1f").addEventListener("click", () => step(-1 / DATA.fps));
  $("#btnPlay").addEventListener("click", () => { if (v.paused) v.play().catch(() => {}); else v.pause(); });
  $("#btnFwd1f").addEventListener("click", () => step(1 / DATA.fps));
  $("#btnFwd1s").addEventListener("click", () => step(1));
  $("#btnLoop").addEventListener("click", toggleLoop);
  $("#btnRate").addEventListener("click", () => {
    rateIdx = (rateIdx + 1) % RATES.length;
    v.playbackRate = RATES[rateIdx];
    $("#btnRate").textContent = RATES[rateIdx] + "x";
  });

  $("#sizeBtn").addEventListener("click", (ev) => {
    bigPlayer = !bigPlayer;
    $("#player").classList.toggle("big", bigPlayer);
    ev.currentTarget.textContent = bigPlayer ? "작게 보기" : "크게 보기";
    ev.currentTarget.setAttribute("aria-pressed", bigPlayer);
  });

  $("#tabs").addEventListener("click", (ev) => {
    const b = ev.target.closest(".tab");
    if (b) openTab(b.dataset.tab, true);
  });
  $("#cutSel").addEventListener("change", (ev) => openTab(ev.target.value, true));
  $("#cutPrev").addEventListener("click", () => {
    const i = TAB_IDS.indexOf(curTab);
    if (i > 0) openTab(TAB_IDS[i - 1], true);
  });
  $("#cutNext").addEventListener("click", () => {
    const i = TAB_IDS.indexOf(curTab);
    if (i < TAB_IDS.length - 1) openTab(TAB_IDS[i + 1], true);
  });

  $("#importFile").addEventListener("change", async (ev) => {
    const file = ev.target.files?.[0];
    if (!file) return;
    try {
      const obj = JSON.parse(await file.text());
      if (obj.verdicts) Object.assign(state.verdicts, obj.verdicts);
      const ids = new Set(state.notes.map((x) => x.id));
      let added = 0;
      (obj.notes || []).forEach((n) => {
        if (n && n.id && !ids.has(n.id)) { state.notes.push(n); added++; }
      });
      saveState();
      renderSummary();
      renderTabs();
      renderRail();
      toast(`JSON에서 메모 ${added}개를 불러왔어요.`);
    } catch (err) {
      toast("JSON 파일을 읽지 못했어요.");
    }
    ev.target.value = "";
  });

  window.addEventListener("keydown", (ev) => {
    const tag = document.activeElement?.tagName;
    if (tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT") return;
    if (ev.code === "Space") { ev.preventDefault(); if (v.paused) v.play().catch(() => {}); else v.pause(); }
    else if (ev.key === "ArrowLeft") { ev.preventDefault(); step(ev.shiftKey ? -1 : -1 / DATA.fps); }
    else if (ev.key === "ArrowRight") { ev.preventDefault(); step(ev.shiftKey ? 1 : 1 / DATA.fps); }
    else if (ev.key === "[") { const i = TAB_IDS.indexOf(curTab); if (i > 0) openTab(TAB_IDS[i - 1], true); }
    else if (ev.key === "]") { const i = TAB_IDS.indexOf(curTab); if (i < TAB_IDS.length - 1) openTab(TAB_IDS[i + 1], true); }
    else if (ev.key === "l" || ev.key === "L") { toggleLoop(); }
    else if (ev.key === "n" || ev.key === "N") { ev.preventDefault(); $("#tin").value = fmt(v.currentTime); updateNoteFormTag(); $("#txt")?.focus(); }
  });

  const c0 = DATA.cuts.find((x) => x.id === curTab);
  if (c0) syncTimeUI(c0.t0); else syncTimeUI(0);
}

init();
</script>
</body>
</html>
